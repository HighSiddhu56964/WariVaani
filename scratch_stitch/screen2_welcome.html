<!DOCTYPE html><html lang="mr"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Warivaani - Welcome</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<style data-purpose="custom-fonts-and-theme">
    @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Marathi:ital@0;1&display=swap');
    
    body {
      font-family: 'Be Vietnam Pro', 'Tiro Devanagari Marathi', sans-serif;
    }
    
    .marathi-text {
      font-family: 'Tiro Devanagari Marathi', serif;
    }

    /* Simulate richer parchment texture and background elements */
    .bg-texture {
      position: fixed;
      inset: 0;
      background-color: #fdf5e6;
      background-image: 
        radial-gradient(#d4c4a8 1.5px, transparent 1.5px),
        radial-gradient(#e2d5bd 1px, transparent 1px);
      background-size: 24px 24px, 16px 16px;
      background-position: 0 0, 8px 8px;
      opacity: 0.6;
      pointer-events: none;
      z-index: -2;
    }
    
    .bg-overlay-gradient {
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at 50% 30%, rgba(255,255,255,0.7) 0%, rgba(253,245,230,0.4) 60%, rgba(212,196,168,0.6) 100%);
        pointer-events: none;
        z-index: -1;
    }

    /* Decorative elements inspired by the image */
    .deco-leaves {
        position: fixed;
        top: -20px;
        left: -20px;
        width: 150px;
        height: 150px;
        background: radial-gradient(ellipse at center, rgba(120, 140, 80, 0.4) 0%, transparent 70%);
        border-radius: 50%;
        filter: blur(10px);
        z-index: -1;
    }
    
    .deco-flag {
        position: fixed;
        top: 20px;
        right: -30px;
        width: 120px;
        height: 100px;
        background: radial-gradient(ellipse at center, rgba(217, 119, 6, 0.3) 0%, transparent 70%);
        border-radius: 50%;
        filter: blur(15px);
        z-index: -1;
    }

    .deco-silhouette {
        position: fixed;
        top: 15%;
        left: 50%;
        transform: translateX(-50%);
        width: 250px;
        height: 350px;
        background: radial-gradient(ellipse at center, rgba(212, 196, 168, 0.4) 0%, transparent 60%);
        border-radius: 50%;
        z-index: -1;
    }

    .soft-shadow {
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
    }
  </style>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        "colors": {
                "tertiary-fixed-dim": "#ccc6b7",
                "on-tertiary-fixed-variant": "#4a473b",
                "on-primary-fixed": "#2f1500",
                "surface": "#fff8f6",
                "surface-container-high": "#ffe2d7",
                "on-primary-fixed-variant": "#6e3900",
                "background": "#fff8f6",
                "on-tertiary-fixed": "#1e1c12",
                "on-tertiary-container": "#fffbff",
                "tertiary-fixed": "#e9e2d2",
                "surface-container": "#ffeae1",
                "surface-variant": "#ffdbcc",
                "outline": "#887364",
                "on-background": "#351000",
                "tertiary-container": "#797467",
                "inverse-surface": "#51230a",
                "error": "#ba1a1a",
                "on-surface": "#351000",
                "on-secondary-fixed": "#221b00",
                "on-secondary-fixed-variant": "#534600",
                "tertiary": "#605c50",
                "outline-variant": "#dbc2b0",
                "primary": "#8d4b00",
                "primary-container": "#b15f00",
                "surface-container-lowest": "#ffffff",
                "secondary-fixed": "#f9e287",
                "on-error-container": "#93000a",
                "secondary-fixed-dim": "#dcc66e",
                "surface-tint": "#904d00",
                "secondary": "#6e5e0d",
                "surface-container-low": "#fff1eb",
                "on-secondary": "#ffffff",
                "on-tertiary": "#ffffff",
                "inverse-primary": "#ffb77d",
                "surface-container-highest": "#ffdbcc",
                "on-secondary-container": "#726212",
                "on-primary-container": "#fffbff",
                "inverse-on-surface": "#ffede6",
                "secondary-container": "#f6df84",
                "on-surface-variant": "#554336",
                "surface-bright": "#fff8f6",
                "on-error": "#ffffff",
                "primary-fixed-dim": "#ffb77d",
                "on-primary": "#ffffff",
                "primary-fixed": "#ffdcc3",
                "surface-dim": "#ffd0bc",
                "error-container": "#ffdad6",
                /* Custom Theme Colors matched to requested */
                'wari-brown': '#351000',
                'wari-saffron': '#8d4b00',
                'wari-navy': '#1e3a8a', /* Keeping for admin */
                'card-bg-light': '#fff8f6',
                'card-border': '#dbc2b0'
        },
        "borderRadius": {
                "DEFAULT": "0.25rem",
                "lg": "0.5rem",
                "xl": "0.75rem",
                "full": "9999px"
        },
        "spacing": {
                "section-margin": "1.5rem",
                "card-inner-padding": "1.25rem",
                "stack-gap": "1rem",
                "gutter": "1rem",
                "container-padding": "1.25rem"
        },
        "fontFamily": {
                "body-lg": [
                        "Be Vietnam Pro"
                ],
                "label-md": [
                        "Be Vietnam Pro"
                ],
                "headline-md": [
                        "Be Vietnam Pro"
                ],
                "caption": [
                        "Be Vietnam Pro"
                ],
                "headline-sm": [
                        "Be Vietnam Pro"
                ],
                "display-lg": [
                        "Be Vietnam Pro"
                ],
                "body-md": [
                        "Be Vietnam Pro"
                ]
        },
        "fontSize": {
                "body-lg": [
                        "18px",
                        {
                                "lineHeight": "26px",
                                "fontWeight": "400"
                        }
                ],
                "label-md": [
                        "14px",
                        {
                                "lineHeight": "20px",
                                "letterSpacing": "0.01em",
                                "fontWeight": "500"
                        }
                ],
                "headline-md": [
                        "24px",
                        {
                                "lineHeight": "32px",
                                "fontWeight": "700"
                        }
                ],
                "caption": [
                        "12px",
                        {
                                "lineHeight": "16px",
                                "fontWeight": "400"
                        }
                ],
                "headline-sm": [
                        "20px",
                        {
                                "lineHeight": "28px",
                                "fontWeight": "600"
                        }
                ],
                "display-lg": [
                        "32px",
                        {
                                "lineHeight": "40px",
                                "letterSpacing": "-0.02em",
                                "fontWeight": "700"
                        }
                ],
                "body-md": [
                        "16px",
                        {
                                "lineHeight": "24px",
                                "fontWeight": "400"
                        }
                ]
        }
},
    },
  }
</script>
</head>
<body class="antialiased h-screen w-screen overflow-hidden flex flex-col items-center justify-between relative bg-surface-container-low text-on-surface">
<!-- Texture overlay and decorations -->
<div class="bg-texture"></div>
<div class="bg-overlay-gradient"></div>
<div class="deco-leaves"></div>
<div class="deco-flag"></div>
<div class="deco-silhouette"></div>
<!-- BEGIN: Header Section -->
<header class="w-full pt-6 flex flex-col items-center z-10 relative px-4 text-center flex-shrink-0">
<!-- Top Greeting -->
<div class="text-sm md:text-base font-bold tracking-wider mb-1 text-on-surface flex items-center justify-center gap-2 marathi-text">
<span class="">॥ राम कृष्ण हरी ॥</span>
</div>
<!-- Small ornamental divider -->
<div class="flex items-center justify-center gap-2 mb-2 w-24">
<div class="h-px bg-primary flex-1"></div>
<div class="w-1 h-1 rotate-45 bg-primary"></div>
<div class="h-px bg-primary flex-1"></div>
</div>
<!-- Logo Area -->
<div class="mt-2 mb-2 flex flex-col items-center">
<div class="w-12 h-12 bg-on-surface rounded-t-full rounded-b-md mb-1 flex items-center justify-center text-surface relative">
<span class="material-symbols-outlined text-2xl">person_celebrate</span>
</div>
<h1 class="text-3xl md:text-4xl font-extrabold text-on-surface mb-0 tracking-wide marathi-text">वारीवाणी</h1>
<div class="flex items-center w-full max-w-[120px]">
<div class="h-px bg-outline flex-1"></div>
<span class="px-2 text-[10px] font-semibold text-primary tracking-[0.2em]">WARIVAANI</span>
<div class="h-px bg-outline flex-1"></div>
</div>
</div>
<!-- Welcome Text -->
<h2 class="text-xl md:text-2xl font-bold text-on-surface mt-2 mb-1 marathi-text">वारीवाणीत आपले स्वागत आहे</h2>
<div class="w-full max-w-[200px] flex items-center justify-center my-1 opacity-60">
<div class="h-px bg-outline flex-1"></div>
</div>
<p class="text-base font-medium text-on-surface-variant marathi-text">आपला अनुभव निवडा</p>
</header>
<!-- END: Header Section -->
<!-- BEGIN: Main Role Selection -->
<main class="w-full max-w-md px-4 flex flex-col gap-4 z-10 flex-1 min-h-0 items-center justify-center pb-2">
<!-- LEFT CARD: Bhakt -->
<div class="h-24 w-full bg-surface border-2 border-primary-fixed-dim/60 rounded-2xl flex items-center soft-shadow relative overflow-hidden"><div class="flex items-center gap-4 w-full h-full px-4"><div class="w-12 h-12 rounded-full border border-primary flex items-center justify-center bg-surface flex-shrink-0"><span class="material-symbols-outlined text-2xl text-primary">sign_language</span></div><div class="flex flex-col items-start text-left flex-1"><h3 class="text-lg font-bold text-primary marathi-text">भक्त</h3><p class="text-[10px] font-medium text-on-surface-variant marathi-text">वारीसोबत जोडलेले रहा</p></div><button class="bg-primary text-on-primary p-2 rounded-full flex items-center justify-center transition-colors shadow-md"><span class="material-symbols-outlined text-lg">arrow_forward</span></button></div></div>
<!-- RIGHT CARD: Administration -->
<div class="h-24 w-full bg-[#f4f6fa] border-2 border-wari-navy/30 rounded-2xl flex items-center soft-shadow relative overflow-hidden"><div class="flex items-center gap-4 w-full h-full px-4"><div class="w-12 h-12 rounded-full border border-wari-navy flex items-center justify-center bg-white flex-shrink-0"><span class="material-symbols-outlined text-2xl text-wari-navy">account_balance</span></div><div class="flex flex-col items-start text-left flex-1"><h3 class="text-lg font-bold text-wari-navy marathi-text">प्रशासन</h3><p class="text-[10px] font-medium text-wari-navy/80 marathi-text">वारी व्यवस्थापनासाठी</p></div><button class="bg-wari-navy text-white p-2 rounded-full flex items-center justify-center transition-colors shadow-md"><span class="material-symbols-outlined text-lg">arrow_forward</span></button></div></div>
</main>
<!-- END: Main Role Selection -->
<!-- BEGIN: Footer -->
<footer class="w-full pb-4 pt-2 flex items-center justify-center z-10 px-4 text-center flex-shrink-0 bg-surface-container-low/80 backdrop-blur-sm">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary -rotate-12">footprint</span>
<p class="text-xs md:text-sm font-semibold text-on-surface marathi-text">विठ्ठलाच्या कृपेने, वारीवाणी आपल्यासोबत आहे.</p>
<span class="material-symbols-outlined text-primary rotate-12">footprint</span>
</div>
</footer>
<!-- END: Footer -->


</body></html>
