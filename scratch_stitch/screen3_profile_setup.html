<script>
        function toggleSections() {
            const inWari = document.querySelector('input[name="connection_type"][value="in_wari"]').checked;
            const familyInWari = document.querySelector('input[name="connection_type"][value="family_in_wari"]').checked;
            
            const sectionInWari = document.getElementById('section_in_wari');
            const sectionFamily = document.getElementById('section_family_in_wari');

            if (inWari) {
                sectionInWari.classList.add('expanded');
                sectionFamily.classList.remove('expanded');
            } else if (familyInWari) {
                sectionFamily.classList.add('expanded');
                sectionInWari.classList.remove('expanded');
            }
        }

        function toggleWariMobile() {
            const hasMobile = document.querySelector('input[name="wari_mobile"][value="yes"]').checked;
            const noMobile = document.querySelector('input[name="wari_mobile"][value="no"]').checked;
            
            const subHasMobile = document.getElementById('sub_has_mobile');
            const subNoMobile = document.getElementById('sub_no_mobile');

            if (hasMobile) {
                subHasMobile.classList.remove('hidden');
                subNoMobile.classList.add('hidden');
            } else if (noMobile) {
                subNoMobile.classList.remove('hidden');
                subHasMobile.classList.add('hidden');
            }
        }
    </script>
